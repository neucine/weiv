name: Publish Windows Binary

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish @weivjs/weiv-win32-x64-msvc to npm"
        required: true
        type: boolean
        default: false
      upload_release_asset:
        description: "Upload the Windows .exe to the GitHub release"
        required: true
        type: boolean
        default: true
      expected_version:
        description: "Optional package version guard (for example 0.1.0)"
        required: false
        type: string

jobs:
  publish-windows-binary:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check package version guard
        if: ${{ inputs.expected_version != '' }}
        run: |
          actual="$(node -p "require('./packages/weiv-win32-x64-msvc/package.json').version")"
          if [[ "$actual" != "${{ inputs.expected_version }}" ]]; then
            echo "Expected version ${{ inputs.expected_version }}, found $actual" >&2
            exit 1
          fi

      - name: Resolve release metadata
        id: release_meta
        run: |
          version="$(node -p "require('./packages/weiv-win32-x64-msvc/package.json').version")"
          tag="v${version}"
          asset_name="weiv-win32-x64-msvc.exe"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Build Rust parser backend
        run: cargo build --release --manifest-path libs/parser-backend/Cargo.toml

      - name: Build Windows CLI
        run: zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseFast

      - name: Stage Windows binary into npm package
        run: |
          test -f zig-out/bin/weiv.exe
          cp zig-out/bin/weiv.exe packages/weiv-win32-x64-msvc/bin/weiv.exe

      - name: Verify packaged CLI runs
        run: ./packages/weiv-win32-x64-msvc/bin/weiv.exe --help

      - name: Pack Windows npm package
        run: npm pack ./packages/weiv-win32-x64-msvc

      - name: Publish Windows npm package
        if: ${{ inputs.publish }}
        run: npm publish ./packages/weiv-win32-x64-msvc --access public

      - name: Ensure GitHub release exists
        if: ${{ inputs.upload_release_asset }}
        run: |
          gh release view "${{ steps.release_meta.outputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.release_meta.outputs.tag }}" \
              --target "$GITHUB_SHA" \
              --title "${{ steps.release_meta.outputs.tag }}" \
              --notes ""

      - name: Upload Windows binary to GitHub release
        if: ${{ inputs.upload_release_asset }}
        run: |
          gh release upload "${{ steps.release_meta.outputs.tag }}" \
            "packages/weiv-win32-x64-msvc/bin/weiv.exe#${{ steps.release_meta.outputs.asset_name }}" \
            --clobber
