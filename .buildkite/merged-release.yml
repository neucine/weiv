steps:
  - wait: ~

  - label: ":mag: Release prerequisites"
    key: merged-release-prerequisites
    command: .buildkite/scripts/release-prerequisites.sh
    agents:
      queue: macos-local

  - wait: ~

  - label: ":mac: Verify macOS release archive"
    key: merged-candidate-macos
    command: .buildkite/scripts/release-candidate.sh macos
    agents:
      queue: macos-local

  - label: ":linux: Verify Linux release archive"
    key: merged-candidate-linux
    command: .buildkite/scripts/release-candidate.sh linux
    agents:
      queue: linux-local-gpu

  - label: ":windows: Verify Windows release archive"
    key: merged-candidate-windows
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .buildkite/scripts/release-candidate-windows.ps1
    agents:
      queue: windows-local

  - wait: ~

  - label: ":package: Collect and compare release artifacts"
    key: merged-collect-release
    command: CANDIDATE_STEP_PREFIX=merged-candidate .buildkite/scripts/collect-release.sh macos linux windows
    agents:
      queue: macos-local

  - block: ":lock: Approve Weiv release"
    key: approve-release
    prompt: "Publish the verified macOS, Linux, and Windows packages from this merged commit?"

  - label: ":npm: Publish verified packages"
    key: merged-publish-release
    command: .buildkite/scripts/publish-release.sh
    secrets:
      - NPM_TOKEN
      - GITHUB_RELEASE_TOKEN
    agents:
      queue: macos-local

  - wait: ~

  - label: ":mac: Check published macOS package"
    key: merged-published-macos
    command: .buildkite/scripts/published-smoke.sh macos
    agents:
      queue: macos-local

  - label: ":linux: Check published Linux package"
    key: merged-published-linux
    command: .buildkite/scripts/published-smoke.sh linux
    agents:
      queue: linux-local-gpu

  - label: ":windows: Check published Windows package"
    key: merged-published-windows
    command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .buildkite/scripts/published-smoke-windows.ps1
    agents:
      queue: windows-local

  - wait: ~

  - label: ":github: Record GitHub release"
    key: merged-finalize-release
    command: .buildkite/scripts/finalize-release.sh
    secrets:
      - GITHUB_RELEASE_TOKEN
    agents:
      queue: macos-local
